<!doctype html>
<html lang="fa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tastix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nosifer&family=Lalezar&family=Share+Tech+Mono&family=Rajdhani:wght@400;500;600;700&family=Noto+Serif+JP:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-void:#05080a;
    --bg-surface:#0b1512;
    --bg-elevated:#101d18;
    --border-dim:#1b3229;
    --border-faint:#13241d;
    --matrix:#3dffa0;
    --matrix-dim:#1c8f5c;
    --violet:#b79bff;
    --violet-dim:#6a52b0;
    --crimson:#ff4568;
    --crimson-dim:#9c2340;
    --text-primary:#dfffec;
    --text-muted:#7fa694;
    --text-faint:#456156;
  }

  *{box-sizing:border-box;}

  html,body{height:100%;margin:0;}
  body{
    background:var(--bg-void);
    color:var(--text-primary);
    font-family:'Rajdhani','Tahoma',sans-serif;
    overflow-x:hidden;
    position:relative;
  }

  canvas#rain{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:0;
    opacity:.22;
    pointer-events:none;
  }

  .wrap{
    position:relative;
    z-index:1;
    display:flex;
    flex-direction:column;
    min-height:100%;
    padding:20px clamp(16px,4vw,40px) 32px;
    gap:22px;
  }

  header{
    display:flex;
    flex-wrap:wrap;
    align-items:flex-end;
    justify-content:space-between;
    gap:14px;
    border-bottom:1px solid var(--border-dim);
    padding-bottom:16px;
  }
  .brand h1{
    margin:0;
    font-family:'Nosifer','Share Tech Mono',monospace;
    font-weight:400;
    font-size:clamp(26px,4.4vw,38px);
    letter-spacing:.02em;
    color:var(--matrix);
    filter:url(#tastix-jag) drop-shadow(0 0 8px rgba(61,255,160,.65)) drop-shadow(0 0 22px rgba(61,255,160,.4));
    animation:flicker 6s infinite steps(30);
  }
  @media (prefers-reduced-motion: reduce){
    .brand h1{animation:none;}
  }
  @keyframes flicker{
    0%,4%,6%,8%,88%,92%,100%{opacity:1;}
    5%,7%,90%{opacity:.72;}
  }
  .brand p{
    margin:4px 0 0;
    display:flex;
    flex-wrap:wrap;
    gap:.4em;
    font-size:14px;
    letter-spacing:.02em;
    color:var(--matrix);
    font-family:'Share Tech Mono',monospace;
    text-shadow:0 0 6px rgba(61,255,160,.6),0 0 16px rgba(61,255,160,.35);
    animation:flicker 6s infinite steps(30);
  }
  .brand p .lang-word{display:inline-block;}
  .brand p .lang-word.scrambling{
    color:#c8ffe0;
    text-shadow:0 0 8px rgba(61,255,160,.9),0 0 20px rgba(61,255,160,.6);
  }
  @media (prefers-reduced-motion: reduce){
    .brand p{animation:none;}
  }
  .tally{
    display:flex;
    gap:10px;
    font-family:'Share Tech Mono',monospace;
    font-size:12px;
  }
  .tally span{
    border:1px solid var(--border-dim);
    background:var(--bg-surface);
    padding:6px 12px;
    border-radius:2px;
    color:var(--text-muted);
    white-space:nowrap;
  }
  .tally b{color:var(--matrix);font-weight:400;}

  .header-controls{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .bgm-toggle{
    display:flex;
    align-items:center;
    gap:6px;
    border:1px solid var(--border-dim);
    background:var(--bg-surface);
    color:var(--text-muted);
    font-family:'Share Tech Mono',monospace;
    font-size:11px;
    letter-spacing:.06em;
    padding:6px 12px;
    border-radius:2px;
    cursor:pointer;
    transition:border-color .2s,color .2s,box-shadow .2s;
  }
  .bgm-toggle:hover,.bgm-toggle:focus-visible{border-color:var(--accent-dim,var(--matrix));color:var(--matrix);}
  .bgm-toggle .note{
    font-size:13px;
    line-height:1;
    display:inline-block;
  }
  .bgm-toggle.playing{
    color:var(--matrix);
    border-color:var(--matrix-dim);
    box-shadow:0 0 10px -2px rgba(61,255,160,.5);
  }
  .bgm-toggle.playing .note{animation:note-bounce 1s ease-in-out infinite;}
  @keyframes note-bounce{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-3px);}
  }
  @media (prefers-reduced-motion: reduce){
    .bgm-toggle.playing .note{animation:none;}
  }

  main{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:18px;
    flex:1;
    min-height:0;
  }
  @media (max-width:760px){
    main{grid-template-columns:1fr;}
  }

  .col{
    display:flex;
    flex-direction:column;
    min-height:0;
    background:linear-gradient(180deg,var(--bg-surface),var(--bg-void));
    border:1px solid var(--border-dim);
    border-radius:4px;
    overflow:hidden;
    position:relative;
  }
  .col[data-status="planned"]{--accent:var(--matrix);--accent-dim:var(--matrix-dim);}
  .col[data-status="doing"]{--accent:var(--violet);--accent-dim:var(--violet-dim);}
  .col[data-status="done"]{--accent:var(--crimson);--accent-dim:var(--crimson-dim);}
  .col{border-top:2px solid var(--accent-dim);}
  .col.drag-over{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent),0 0 18px -4px var(--accent);}

  .col-head{
    padding:14px 16px 10px;
    position:relative;
    overflow:hidden;
    flex-shrink:0;
  }
  .col-head .kanji{
    position:absolute;
    top:-14px;
    right:4px;
    font-family:'Noto Serif JP',serif;
    font-size:72px;
    color:var(--accent);
    opacity:.07;
    line-height:1;
    pointer-events:none;
  }
  .col-head h2{
    margin:0;
    font-family:'Lalezar','Tahoma',sans-serif;
    font-size:22px;
    font-weight:400;
    letter-spacing:.01em;
    color:var(--accent);
    filter:url(#tastix-jag) drop-shadow(0 0 5px var(--accent)) drop-shadow(0 0 14px var(--accent));
    position:relative;
  }
  .col-head .sub{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:4px;
    position:relative;
  }
  .col-head .sub span.tag{
    font-family:'Share Tech Mono',monospace;
    font-size:11px;
    letter-spacing:.12em;
    color:var(--accent);
  }
  .col-head .sub span.count{
    font-family:'Share Tech Mono',monospace;
    font-size:11px;
    color:var(--text-faint);
    border:1px solid var(--border-faint);
    border-radius:10px;
    padding:1px 8px;
  }
  .col[data-status="doing"] .col-head{
    animation:pulse 3.2s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{box-shadow:inset 0 -24px 24px -24px rgba(183,155,255,0);}
    50%{box-shadow:inset 0 -24px 24px -24px rgba(183,155,255,.35);}
  }
  @media (prefers-reduced-motion: reduce){
    .col[data-status="doing"] .col-head{animation:none;}
  }

  .col-body{
    flex:1;
    min-height:80px;
    overflow-y:auto;
    padding:4px 12px 12px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .col-body::-webkit-scrollbar{width:8px;}
  .col-body::-webkit-scrollbar-track{background:transparent;}
  .col-body::-webkit-scrollbar-thumb{background:var(--border-dim);border-radius:4px;}

  .col-body:empty::after{
    content:"—";
    color:var(--text-faint);
    font-family:'Share Tech Mono',monospace;
    font-size:12px;
    text-align:center;
    padding:10px 0;
  }

  .card{
    background:var(--bg-elevated);
    border:1px solid var(--border-dim);
    border-inline-start:3px solid var(--accent);
    clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px));
    padding:10px 56px 10px 12px;
    position:relative;
    cursor:grab;
    transition:box-shadow .15s,transform .15s,opacity .15s;
  }
  .card:hover{box-shadow:0 0 0 1px var(--accent-dim),0 6px 18px -8px rgba(0,0,0,.6);}
  .card.dragging{
    opacity:.92;
    cursor:grabbing;
    transform:rotate(-2deg) scale(1.05);
    box-shadow:0 0 0 1px var(--accent),0 0 26px 2px var(--accent),0 14px 30px -10px rgba(0,0,0,.8);
    z-index:5;
  }
  @keyframes card-land{
    0%{transform:scale(1.12);box-shadow:0 0 0 2px var(--accent),0 0 32px 6px var(--accent);}
    60%{transform:scale(.98);box-shadow:0 0 0 1px var(--accent),0 0 16px 2px var(--accent);}
    100%{transform:scale(1);box-shadow:0 0 0 0 transparent;}
  }
  .card.landed{animation:card-land .45s cubic-bezier(.34,1.56,.64,1);}
  @media (prefers-reduced-motion: reduce){
    .card.dragging{transform:none;}
    .card.landed{animation:none;}
  }

  @keyframes col-flash{
    0%{box-shadow:inset 0 0 0 2px var(--accent),0 0 24px -4px var(--accent);}
    100%{box-shadow:inset 0 0 0 0 transparent,0 0 0 0 transparent;}
  }
  .col.landing{animation:col-flash .5s ease-out;}
  @media (prefers-reduced-motion: reduce){
    .col.landing{animation:none;}
  }
  .card p{
    margin:0;
    font-size:15px;
    line-height:1.45;
    color:var(--text-primary);
    word-break:break-word;
  }
  .card .del,.card .edit{
    position:absolute;
    top:6px;
    width:20px;
    height:20px;
    border:none;
    background:transparent;
    color:var(--text-faint);
    font-family:'Share Tech Mono',monospace;
    font-size:14px;
    line-height:1;
    cursor:pointer;
    border-radius:3px;
    opacity:0;
    transition:opacity .15s,color .15s,background .15s;
  }
  .card .del{right:8px;}
  .card .edit{right:30px;font-size:13px;}
  .card:hover .del,.card:hover .edit,.card .del:focus-visible,.card .edit:focus-visible{opacity:1;}
  .card .del:hover{color:var(--crimson);background:rgba(255,69,104,.12);}
  .card .edit:hover{color:var(--accent);background:rgba(61,255,160,.12);}

  .card .edit-input{
    display:none;
    width:100%;
    background:var(--bg-void);
    border:1px solid var(--accent-dim);
    color:var(--text-primary);
    font-family:'Rajdhani',sans-serif;
    font-size:15px;
    padding:4px 6px;
    border-radius:3px;
  }
  .card .edit-input:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .card.editing{cursor:default;}
  .card.editing p,.card.editing .del,.card.editing .edit{display:none;}
  .card.editing .edit-input{display:block;}

  .add-row{
    flex-shrink:0;
    border-top:1px solid var(--border-faint);
    padding:10px 12px 14px;
  }
  .add-toggle{
    width:100%;
    background:transparent;
    border:1px dashed var(--border-dim);
    color:var(--text-muted);
    font-family:'Rajdhani',sans-serif;
    font-weight:600;
    font-size:14px;
    padding:8px;
    border-radius:3px;
    cursor:pointer;
    transition:border-color .15s,color .15s;
  }
  .add-toggle:hover,.add-toggle:focus-visible{border-color:var(--accent);color:var(--accent);}

  .add-form{display:none;gap:6px;}
  .add-form.open{display:flex;}
  .add-form input{
    flex:1;
    background:var(--bg-void);
    border:1px solid var(--border-dim);
    color:var(--text-primary);
    font-family:'Rajdhani',sans-serif;
    font-size:14px;
    padding:8px 10px;
    border-radius:3px;
    min-width:0;
  }
  .add-form input:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .add-form button{
    background:var(--accent-dim);
    border:none;
    color:#04140b;
    font-family:'Share Tech Mono',monospace;
    font-size:12px;
    padding:0 12px;
    border-radius:3px;
    cursor:pointer;
  }
  .add-form button:hover{filter:brightness(1.25);}

  footer{
    text-align:center;
    color:var(--text-faint);
    font-family:'Share Tech Mono',monospace;
    font-size:11px;
    letter-spacing:.06em;
  }
  footer[data-status="saving"]{color:var(--text-muted);}
  footer[data-status="failed"]{color:var(--crimson);text-shadow:0 0 8px rgba(255,69,104,.5);}

  :focus-visible{outline:2px solid var(--matrix);outline-offset:2px;}

  #auth-gate{
    position:fixed;
    inset:0;
    z-index:50;
    background:rgba(5,8,10,.92);
    display:flex;
    align-items:center;
    justify-content:center;
    backdrop-filter:blur(4px);
  }
  #auth-gate[hidden]{display:none;}
  .auth-box{
    border:1px solid var(--border-dim);
    background:linear-gradient(180deg,var(--bg-surface),var(--bg-void));
    border-radius:6px;
    padding:28px 30px;
    width:min(320px,88vw);
    text-align:center;
    box-shadow:0 0 30px -6px rgba(61,255,160,.25);
  }
  .auth-box h2{
    margin:0 0 6px;
    font-family:'Lalezar','Tahoma',sans-serif;
    font-weight:400;
    font-size:24px;
    color:var(--matrix);
    text-shadow:0 0 6px rgba(61,255,160,.6),0 0 16px rgba(61,255,160,.35);
  }
  .auth-box p{
    margin:0 0 16px;
    color:var(--text-muted);
    font-size:13px;
  }
  .auth-box input{
    width:100%;
    background:var(--bg-void);
    border:1px solid var(--border-dim);
    color:var(--text-primary);
    font-family:'Share Tech Mono',monospace;
    font-size:15px;
    padding:10px;
    border-radius:3px;
    margin-bottom:10px;
  }
  .auth-box input::placeholder{color:var(--text-faint);}
  .google-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    width:100%;
    padding:10px;
    background:#131314;
    border:1px solid #8e918f;
    border-radius:3px;
    color:#e3e3e3;
    font-family:'Rajdhani','Tahoma',sans-serif;
    font-weight:600;
    font-size:14px;
    text-decoration:none;
    transition:border-color .15s,box-shadow .15s;
  }
  .google-btn:hover{border-color:var(--matrix);box-shadow:0 0 12px -4px rgba(61,255,160,.6);}
  .auth-divider{
    display:flex;
    align-items:center;
    gap:10px;
    margin:16px 0 12px;
    color:var(--text-faint);
    font-size:12px;
  }
  .auth-divider::before,.auth-divider::after{
    content:"";
    flex:1;
    border-top:1px solid var(--border-dim);
  }
  .auth-box form button:disabled{opacity:.6;cursor:wait;}
  .auth-switch{
    margin-top:14px;
    background:none;
    border:none;
    color:var(--text-muted);
    font-family:'Rajdhani','Tahoma',sans-serif;
    font-size:13px;
    font-weight:500;
    text-decoration:underline;
    text-underline-offset:3px;
    cursor:pointer;
  }
  .auth-switch:hover{color:var(--matrix);}
  .user-email{
    font-family:'Share Tech Mono',monospace;
    font-size:12px;
    color:var(--text-muted);
    max-width:200px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .auth-box input:focus{outline:2px solid var(--matrix);outline-offset:1px;}
  .auth-box form button{
    width:100%;
    background:var(--matrix-dim);
    border:none;
    color:#04140b;
    font-family:'Rajdhani',sans-serif;
    font-weight:700;
    font-size:14px;
    padding:10px;
    border-radius:3px;
    cursor:pointer;
  }
  .auth-box form button:hover{filter:brightness(1.2);}
  .auth-box .err{
    min-height:16px;
    color:var(--crimson);
    font-size:12px;
    margin-top:10px;
  }
  .auth-box.shake{animation:shake .3s;}
  @keyframes shake{
    25%{transform:translateX(-6px);}
    75%{transform:translateX(6px);}
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="tastix-jag">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<div id="auth-gate">
  <div class="auth-box">
    <h2 id="auth-title">ورود</h2>
    <p id="auth-hint">با گوگل یا ایمیلت وارد شو</p>
    <a class="google-btn" href="/api/auth/google">
      <svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      <span>ورود با گوگل</span>
    </a>
    <div class="auth-divider"><span>یا با ایمیل</span></div>
    <form id="auth-form">
      <input type="email" id="auth-email" dir="ltr" autocomplete="email" placeholder="email@example.com" aria-label="ایمیل" required autofocus>
      <input type="password" id="auth-password" dir="ltr" autocomplete="current-password" placeholder="••••••••" aria-label="رمز عبور" required>
      <button type="submit" id="auth-submit">ورود</button>
      <div class="err" id="auth-err" role="alert"></div>
    </form>
    <button type="button" class="auth-switch" id="auth-switch">حساب نداری؟ ثبت‌نام کن</button>
  </div>
</div>

<div class="wrap">
  <canvas id="rain" aria-hidden="true"></canvas>

  <header>
    <div class="brand">
      <h1>TASTIX</h1>
      <p class="tagline" dir="rtl" id="tagline"></p>
    </div>
    <div class="header-controls">
      <div class="tally" id="tally"></div>
      <span class="user-email" id="user-email" dir="ltr"></span>
      <button class="bgm-toggle" id="logout-btn" type="button">خروج</button>
      <button class="bgm-toggle" id="bgm-toggle" type="button" aria-label="پخش موسیقی">
        <span class="note" aria-hidden="true">♪</span>
        <span id="bgm-label">پخش موسیقی</span>
      </button>
    </div>
  </header>

  <audio id="bgm" src="/api/audio" loop preload="none"></audio>

  <main>
    <section class="col" data-status="planned">
      <div class="col-head">
        <span class="kanji">計</span>
        <h2 dir="auto">برنامه‌ریزی‌شده</h2>
        <div class="sub"><span class="tag">PLANNED</span><span class="count" id="count-planned">0</span></div>
      </div>
      <div class="col-body" id="body-planned" data-status="planned"></div>
      <div class="add-row">
        <button class="add-toggle" data-target="planned" type="button">+ افزودن تسک</button>
        <form class="add-form" data-status="planned">
          <input dir="auto" type="text" maxlength="140" placeholder="متن تسک…" aria-label="متن تسک جدید">
          <button type="submit">ثبت</button>
        </form>
      </div>
    </section>

    <section class="col" data-status="doing">
      <div class="col-head">
        <span class="kanji">動</span>
        <h2 dir="auto">در حال انجام</h2>
        <div class="sub"><span class="tag">DOING</span><span class="count" id="count-doing">0</span></div>
      </div>
      <div class="col-body" id="body-doing" data-status="doing"></div>
      <div class="add-row">
        <button class="add-toggle" data-target="doing" type="button">+ افزودن تسک</button>
        <form class="add-form" data-status="doing">
          <input dir="auto" type="text" maxlength="140" placeholder="متن تسک…" aria-label="متن تسک جدید">
          <button type="submit">ثبت</button>
        </form>
      </div>
    </section>

    <section class="col" data-status="done">
      <div class="col-head">
        <span class="kanji">了</span>
        <h2 dir="auto">انجام‌شده</h2>
        <div class="sub"><span class="tag">DONE</span><span class="count" id="count-done">0</span></div>
      </div>
      <div class="col-body" id="body-done" data-status="done"></div>
      <div class="add-row">
        <button class="add-toggle" data-target="done" type="button">+ افزودن تسک</button>
        <form class="add-form" data-status="done">
          <input dir="auto" type="text" maxlength="140" placeholder="متن تسک…" aria-label="متن تسک جدید">
          <button type="submit">ثبت</button>
        </form>
      </div>
    </section>
  </main>

  <footer id="sync-status" data-status="saved" role="status">SIGNAL STABLE — BOARD SYNCED TO SERVER</footer>
</div>

<script>
(function(){
  "use strict";
  var LEGACY_STORAGE_KEY = 'task-matrix-state';
  var STATUSES = ['planned','doing','done'];
  var lastDragId = null;

  var state = {tasks: []};

  function readLegacyTasks(){
    try{
      var raw = localStorage.getItem(LEGACY_STORAGE_KEY);
      var parsed = raw && JSON.parse(raw);
      if(parsed && Array.isArray(parsed.tasks)) return parsed.tasks;
    }catch(e){}
    return [];
  }

  function clearLegacyTasks(){
    try{ localStorage.removeItem(LEGACY_STORAGE_KEY); }catch(e){}
  }

  function uid(){
    return 't_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8);
  }

  function render(){
    STATUSES.forEach(function(status){
      var body = document.getElementById('body-' + status);
      body.innerHTML = '';
      var items = state.tasks.filter(function(t){return t.status===status;});
      items.forEach(function(task){
        body.appendChild(buildCard(task));
      });
      document.getElementById('count-' + status).textContent = items.length;
    });
    var tally = document.getElementById('tally');
    tally.innerHTML = '';
    var total = state.tasks.length;
    var span = document.createElement('span');
    span.innerHTML = '<b>' + total + '</b> وظیفه کل';
    tally.appendChild(span);
  }

  function buildCard(task){
    var card = document.createElement('div');
    card.className = 'card';
    card.draggable = true;
    card.dataset.id = task.id;

    var p = document.createElement('p');
    p.dir = 'auto';
    p.textContent = task.text;
    p.addEventListener('dblclick', function(){
      startEdit(card, task);
    });
    card.appendChild(p);

    var del = document.createElement('button');
    del.className = 'del';
    del.type = 'button';
    del.setAttribute('aria-label','حذف تسک');
    del.textContent = '×';
    del.addEventListener('click', function(e){
      e.stopPropagation();
      removeTask(task.id);
    });
    card.appendChild(del);

    var edit = document.createElement('button');
    edit.className = 'edit';
    edit.type = 'button';
    edit.setAttribute('aria-label','ویرایش تسک');
    edit.textContent = '✎';
    edit.addEventListener('click', function(e){
      e.stopPropagation();
      startEdit(card, task);
    });
    card.appendChild(edit);

    var input = document.createElement('input');
    input.className = 'edit-input';
    input.type = 'text';
    input.maxLength = 140;
    input.dir = 'auto';
    input.value = task.text;
    input.addEventListener('mousedown', function(e){
      e.stopPropagation();
    });
    input.addEventListener('keydown', function(e){
      if(e.key === 'Enter'){
        e.preventDefault();
        input.blur();
      } else if(e.key === 'Escape'){
        e.preventDefault();
        input.value = task.text;
        input.blur();
      }
    });
    input.addEventListener('blur', function(){
      commitEdit(card, task, input);
    });
    card.appendChild(input);

    card.addEventListener('dragstart', function(e){
      card.classList.add('dragging');
      lastDragId = task.id;
      e.dataTransfer.setData('text/plain', task.id);
      e.dataTransfer.effectAllowed = 'move';
    });
    card.addEventListener('dragend', function(){
      card.classList.remove('dragging');
      syncOrderFromDOM();
    });

    return card;
  }

  function getDragAfterElement(container, y){
    var cards = Array.prototype.slice.call(container.querySelectorAll('.card:not(.dragging)'));
    var closest = {offset: -Infinity, element: null};
    cards.forEach(function(card){
      var box = card.getBoundingClientRect();
      var offset = y - box.top - box.height/2;
      if(offset < 0 && offset > closest.offset){
        closest = {offset: offset, element: card};
      }
    });
    return closest.element;
  }

  function wireColumns(){
    document.querySelectorAll('.col-body').forEach(function(body){
      body.addEventListener('dragover', function(e){
        e.preventDefault();
        var col = body.closest('.col');
        col.classList.add('drag-over');
        var dragging = document.querySelector('.card.dragging');
        if(!dragging) return;
        var after = getDragAfterElement(body, e.clientY);
        if(after == null){
          body.appendChild(dragging);
        } else {
          body.insertBefore(dragging, after);
        }
      });
      body.addEventListener('dragleave', function(e){
        if(e.target === body) body.closest('.col').classList.remove('drag-over');
      });
      body.addEventListener('drop', function(e){
        e.preventDefault();
        body.closest('.col').classList.remove('drag-over');
      });
    });
    document.querySelectorAll('.col').forEach(function(col){
      col.addEventListener('dragleave', function(e){
        if(!col.contains(e.relatedTarget)) col.classList.remove('drag-over');
      });
    });
  }

  function syncOrderFromDOM(){
    document.querySelectorAll('.col').forEach(function(c){c.classList.remove('drag-over');});
    var next = [];
    STATUSES.forEach(function(status){
      var body = document.getElementById('body-' + status);
      Array.prototype.slice.call(body.querySelectorAll('.card')).forEach(function(cardEl){
        var task = state.tasks.find(function(t){return t.id === cardEl.dataset.id;});
        if(task){
          task.status = status;
          next.push(task);
        }
      });
    });
    if(next.length === state.tasks.length){
      state.tasks = next;
    }
    render();
    persist();
    playLandEffect();
  }

  function playLandEffect(){
    if(!lastDragId) return;
    var id = lastDragId;
    lastDragId = null;
    var cardEl = document.querySelector('.card[data-id="' + id + '"]');
    if(!cardEl) return;
    cardEl.classList.add('landed');
    cardEl.addEventListener('animationend', function(){
      cardEl.classList.remove('landed');
    }, {once:true});
    var col = cardEl.closest('.col');
    if(col){
      col.classList.add('landing');
      col.addEventListener('animationend', function(){
        col.classList.remove('landing');
      }, {once:true});
    }
  }

  function removeTask(id){
    var cardEl = document.querySelector('.card[data-id="' + id + '"]');
    if(cardEl){
      cardEl.style.opacity = '0';
      cardEl.style.transform = 'scale(.92)';
    }
    setTimeout(function(){
      state.tasks = state.tasks.filter(function(t){return t.id !== id;});
      render();
      persist();
    }, 120);
  }

  function startEdit(cardEl, task){
    cardEl.classList.add('editing');
    cardEl.draggable = false;
    var input = cardEl.querySelector('.edit-input');
    input.value = task.text;
    input.focus();
    input.select();
  }

  function commitEdit(cardEl, task, input){
    var text = input.value.trim();
    if(text && text !== task.text){
      task.text = text;
      persist();
    }
    render();
  }

  function addTask(status, text){
    text = text.trim();
    if(!text) return;
    state.tasks.push({id: uid(), text: text, status: status});
    render();
    persist();
  }

  function wireAddForms(){
    document.querySelectorAll('.add-toggle').forEach(function(btn){
      btn.addEventListener('click', function(){
        var status = btn.dataset.target;
        var form = document.querySelector('.add-form[data-status="' + status + '"]');
        var open = form.classList.toggle('open');
        btn.style.display = open ? 'none' : 'block';
        if(open) form.querySelector('input').focus();
      });
    });
    document.querySelectorAll('.add-form').forEach(function(form){
      form.addEventListener('submit', function(e){
        e.preventDefault();
        var input = form.querySelector('input');
        addTask(form.dataset.status, input.value);
        input.value = '';
        form.classList.remove('open');
        document.querySelector('.add-toggle[data-target="' + form.dataset.status + '"]').style.display = 'block';
      });
      form.querySelector('input').addEventListener('keydown', function(e){
        if(e.key === 'Escape'){
          form.classList.remove('open');
          document.querySelector('.add-toggle[data-target="' + form.dataset.status + '"]').style.display = 'block';
        }
      });
    });
  }

  var SYNC_LABELS = {
    saving: 'SAVING…',
    saved: 'SIGNAL STABLE — BOARD SYNCED TO SERVER',
    failed: 'SYNC FAILED — CHANGES NOT SAVED'
  };
  function setSyncStatus(status){
    var el = document.getElementById('sync-status');
    el.textContent = SYNC_LABELS[status];
    el.dataset.status = status;
  }

  var saveTimer = null;
  function saveNow(keepalive){
    clearTimeout(saveTimer);
    saveTimer = null;
    fetch('/api/tasks', {
      method: 'PUT',
      credentials: 'same-origin',
      keepalive: keepalive === true,
      headers: {'content-type': 'application/json'},
      body: JSON.stringify({tasks: state.tasks})
    }).then(function(res){
      if(res.status === 401){
        setSyncStatus('failed');
        showGate('نشستت تموم شده، دوباره وارد شو');
      } else {
        setSyncStatus(res.ok ? 'saved' : 'failed');
      }
    }).catch(function(){
      setSyncStatus('failed');
    });
  }
  function persist(){
    setSyncStatus('saving');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveNow, 400);
  }
  window.addEventListener('pagehide', function(){
    if(saveTimer) saveNow(true);
  });

  var TAGLINE_WORDS = [
    {fa:'بورد', jp:'ボード'},
    {fa:'وظایف', jp:'タスク'},
    {fa:'—', jp:'—', still:true},
    {fa:'بکش،', jp:'ドラッグ、'},
    {fa:'رها', jp:'リリース'},
    {fa:'کن،', jp:'して、'},
    {fa:'پیش', jp:'前へ'},
    {fa:'برو.', jp:'進め。'}
  ];

  function initTagline(){
    var el = document.getElementById('tagline');
    if(!el) return;
    el.innerHTML = '';
    var swappable = [];
    TAGLINE_WORDS.forEach(function(word){
      var span = document.createElement('span');
      span.className = 'lang-word';
      span.textContent = word.fa;
      span.dataset.fa = word.fa;
      span.dataset.jp = word.jp;
      span.dataset.lang = 'fa';
      el.appendChild(span);
      if(!word.still) swappable.push(span);
    });

    var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(reduceMotion || !swappable.length) return;

    var GLYPHS = '0101010101アカサタナハマヤラワ';
    function scramble(span, target){
      var frame = 0, total = 9;
      span.classList.add('scrambling');
      var timer = setInterval(function(){
        frame++;
        var reveal = Math.floor(target.length * frame / total);
        var out = '';
        for(var i = 0; i < target.length; i++){
          out += i < reveal ? target[i] : GLYPHS[Math.floor(Math.random() * GLYPHS.length)];
        }
        span.textContent = out;
        if(frame >= total){
          clearInterval(timer);
          span.textContent = target;
          span.classList.remove('scrambling');
        }
      }, 40);
    }

    var idx = 0;
    setInterval(function(){
      var span = swappable[idx % swappable.length];
      idx++;
      var nextLang = span.dataset.lang === 'fa' ? 'jp' : 'fa';
      span.dataset.lang = nextLang;
      scramble(span, span.dataset[nextLang]);
    }, 600);
  }

  function initRain(){
    var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var canvas = document.getElementById('rain');
    var ctx = canvas.getContext('2d');
    var chars = 'アイウエオカキクケコサシスセソタチツテト0123456789';
    var fontSize = 15;
    var columns, drops;

    function resize(){
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      columns = Math.floor(canvas.width / fontSize);
      drops = new Array(columns).fill(0).map(function(){return Math.random()*-40;});
    }
    resize();
    window.addEventListener('resize', resize);

    if(reduceMotion){
      ctx.fillStyle = 'rgba(5,8,10,1)';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      return;
    }

    function frame(){
      ctx.fillStyle = 'rgba(5,8,10,.13)';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle = '#3dffa0';
      ctx.font = fontSize + 'px monospace';
      for(var i=0;i<drops.length;i++){
        var ch = chars[Math.floor(Math.random()*chars.length)];
        ctx.fillText(ch, i*fontSize, drops[i]*fontSize);
        if(drops[i]*fontSize > canvas.height && Math.random() > .975){
          drops[i] = 0;
        }
        drops[i]++;
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  function wireBgm(){
    var audio = document.getElementById('bgm');
    var btn = document.getElementById('bgm-toggle');
    var label = document.getElementById('bgm-label');
    if(!audio || !btn) return;
    btn.addEventListener('click', function(){
      if(audio.paused){
        audio.play().catch(function(){});
      } else {
        audio.pause();
      }
    });
    audio.addEventListener('play', function(){
      btn.classList.add('playing');
      label.textContent = 'توقف موسیقی';
      btn.setAttribute('aria-label','توقف موسیقی');
    });
    audio.addEventListener('pause', function(){
      btn.classList.remove('playing');
      label.textContent = 'پخش موسیقی';
      btn.setAttribute('aria-label','پخش موسیقی');
    });
  }

  function unlockBgm(){
    var audio = document.getElementById('bgm');
    var btn = document.getElementById('bgm-toggle');
    if(!audio || !btn) return;
    audio.play().catch(function(){
      function onFirstInteraction(e){
        if(btn.contains(e.target)) return;
        document.removeEventListener('pointerdown', onFirstInteraction, true);
        document.removeEventListener('keydown', onFirstInteraction, true);
        audio.play().catch(function(){});
      }
      document.addEventListener('pointerdown', onFirstInteraction, true);
      document.addEventListener('keydown', onFirstInteraction, true);
    });
  }

  var AUTH_ERRORS = {
    invalid_credentials: 'ایمیل یا رمز اشتباهه',
    invalid_email: 'ایمیل معتبر نیست',
    weak_password: 'رمز باید حداقل ۸ کاراکتر باشه',
    email_taken: 'این ایمیل قبلاً ثبت‌نام کرده، وارد شو',
    bad_request: 'درخواست نامعتبر'
  };

  var GOOGLE_ERRORS = {
    'google': 'ورود با گوگل ناموفق بود، دوباره تلاش کن',
    'google-config': 'ورود با گوگل هنوز راه‌اندازی نشده',
    'google-cancelled': ''
  };

  function enterBoard(email, tasks){
    state.tasks = tasks;
    render();
    document.getElementById('user-email').textContent = email;
    document.getElementById('auth-password').value = '';
    document.getElementById('auth-gate').hidden = true;
    document.getElementById('bgm').load();
    unlockBgm();
  }

  function handleAuthRedirect(){
    var hash = location.hash;
    if(!hash) return;
    history.replaceState(null, '', location.pathname + location.search);

    if(hash.indexOf('#auth-error=') === 0){
      var reason = hash.slice('#auth-error='.length);
      showGate(reason in GOOGLE_ERRORS ? GOOGLE_ERRORS[reason] : GOOGLE_ERRORS.google);
      return;
    }
    if(hash !== '#google' && hash !== '#google-new') return;

    fetch('/api/me', {credentials: 'same-origin'}).then(function(res){
      return res.json();
    }).then(function(data){
      if(!data.ok){
        showGate(GOOGLE_ERRORS.google);
        return;
      }
      var legacy = hash === '#google-new' && !data.tasks.length ? readLegacyTasks() : [];
      enterBoard(data.email, legacy.length ? legacy : data.tasks);
      if(legacy.length){
        persist();
        clearLegacyTasks();
      }
    }).catch(function(){
      showGate('خطا در اتصال');
    });
  }

  function showGate(message){
    var audio = document.getElementById('bgm');
    audio.pause();
    document.getElementById('auth-gate').hidden = false;
    document.getElementById('auth-err').textContent = message || '';
    document.getElementById('auth-password').value = '';
    document.getElementById('auth-email').focus();
  }

  function wireAuthGate(){
    var gate = document.getElementById('auth-gate');
    var form = document.getElementById('auth-form');
    var emailInput = document.getElementById('auth-email');
    var passInput = document.getElementById('auth-password');
    var submit = document.getElementById('auth-submit');
    var title = document.getElementById('auth-title');
    var hint = document.getElementById('auth-hint');
    var switchBtn = document.getElementById('auth-switch');
    var err = document.getElementById('auth-err');
    var box = gate.querySelector('.auth-box');
    var mode = 'login';

    function setMode(next){
      mode = next;
      var signup = mode === 'signup';
      title.textContent = signup ? 'ثبت‌نام' : 'ورود';
      hint.textContent = signup ? 'یه حساب بساز تا بوردت روی همه‌ی دستگاه‌ها باشه' : 'با گوگل یا ایمیلت وارد شو';
      submit.textContent = signup ? 'ساخت حساب' : 'ورود';
      switchBtn.textContent = signup ? 'حساب داری؟ وارد شو' : 'حساب نداری؟ ثبت‌نام کن';
      passInput.autocomplete = signup ? 'new-password' : 'current-password';
      passInput.minLength = signup ? 8 : 0;
      err.textContent = '';
    }

    function fail(message){
      err.textContent = message;
      box.classList.remove('shake');
      void box.offsetWidth;
      box.classList.add('shake');
    }

    switchBtn.addEventListener('click', function(){
      setMode(mode === 'login' ? 'signup' : 'login');
      emailInput.focus();
    });

    document.getElementById('logout-btn').addEventListener('click', function(){
      if(saveTimer) saveNow();
      fetch('/api/logout', {method: 'POST', credentials: 'same-origin'}).catch(function(){});
      state.tasks = [];
      render();
      document.getElementById('user-email').textContent = '';
      setMode('login');
      showGate();
    });

    form.addEventListener('submit', function(e){
      e.preventDefault();
      err.textContent = '';
      var signup = mode === 'signup';
      var payload = {email: emailInput.value, password: passInput.value};
      if(signup) payload.tasks = readLegacyTasks();
      submit.disabled = true;
      fetch(signup ? '/api/signup' : '/api/login', {
        method: 'POST',
        credentials: 'same-origin',
        headers: {'content-type': 'application/json'},
        body: JSON.stringify(payload)
      }).then(function(res){
        return res.json().catch(function(){ return {}; }).then(function(data){
          if(!res.ok || !data.ok){
            fail(AUTH_ERRORS[data.error] || 'خطای سرور، دوباره تلاش کن');
            if(!signup) passInput.value = '';
            return;
          }
          if(signup) clearLegacyTasks();
          enterBoard(data.email, data.tasks || []);
        });
      }).catch(function(){
        fail('خطا در اتصال');
      }).then(function(){
        submit.disabled = false;
      });
    });
  }

  render();
  wireColumns();
  wireAddForms();
  wireBgm();
  wireAuthGate();
  handleAuthRedirect();
  initRain();
  initTagline();
})();
</script>
</body>
</html>
